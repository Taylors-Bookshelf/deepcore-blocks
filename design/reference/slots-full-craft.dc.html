<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slots full — Craft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffcf5c}a:hover{color:#ffe08f}
.blk{position:relative;width:42px;height:42px;background-size:100% 100%}
.slot{width:42px;height:42px;background:#35383d}
.gap{visibility:hidden}
.b-turf{background-image:url(../assets/blocks/topsoil.svg)}
.b-wood{background-image:url(../assets/blocks/wood-bark.svg)}
.b-limestone{background-image:url(../assets/blocks/limestone.svg)}
.b-granite{background-image:url(../assets/blocks/granite.svg)}
.b-slate{background-image:url(../assets/blocks/slate.svg)}
.b-basalt{background-image:url(../assets/blocks/basalt.svg)}
.b-magma{background-image:url(../assets/blocks/magmastone.svg)}
.g-gold{--g:rgba(255,220,80,.7)}
.g-ruby{--g:rgba(255,50,80,.75)}
.g-emerald{--g:rgba(50,230,120,.7)}
.g-diamond{--g:rgba(90,235,255,.75)}
.spr{position:absolute;inset:0;background-size:100% 100%}
.ore{filter:drop-shadow(0 0 .8px rgba(255,255,255,.55))}
.ore.gold{filter:drop-shadow(0 0 .8px rgba(255,255,255,.55)) drop-shadow(0 0 2px var(--g))}
.gem{filter:drop-shadow(0 0 .8px rgba(255,255,255,.6)) drop-shadow(0 0 4px var(--g))}
.ico{position:relative;width:22px;height:22px;flex:none}
.s-coal{background-image:url(../assets/ores/coal.svg)}
.s-iron{background-image:url(../assets/ores/iron.svg)}
.s-copper{background-image:url(../assets/ores/copper.svg)}
.s-gold{background-image:url(../assets/ores/gold.svg)}
.s-ruby{background-image:url(../assets/gems/ruby.svg)}
.s-emerald{background-image:url(../assets/gems/emerald.svg)}
.s-diamond{background-image:url(../assets/gems/diamond.svg)}
.piece{display:grid;gap:2px}
.pw2{grid-template-columns:repeat(2,20px)}
.pw3{grid-template-columns:repeat(3,20px)}
.pw5{grid-template-columns:repeat(5,20px)}
.piece .blk,.piece .gap{width:20px;height:20px}
.ibtn{width:44px;height:44px;border:0;border-radius:10px;background:#3d4045;color:#ffffff;box-shadow:inset 0 0 0 1px #55585f,inset 0 -3px 0 #2e3035;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tool{position:relative;width:56px;height:56px;flex:none;border:0;padding:0;border-radius:4px;background:#35383d;display:flex;align-items:center;justify-content:center}
.px{width:40px;height:40px;background-size:100% 100%;image-rendering:pixelated}
.px-dyn{background-image:url(../assets/specials/blast-charge.svg)}
.px-sledge{background-image:url(../assets/specials/sledgehammer.svg)}
.px-anvil{width:34px;height:34px;background-image:url(../assets/ui/anvil.svg)}
.spark{position:absolute;left:33px;top:6px;width:6px;height:6px;border-radius:50%;background:#fff3b0;box-shadow:0 0 6px 2px rgba(255,180,40,.85);animation:fizz .45s steps(2) infinite}
@keyframes fizz{50%{transform:scale(.55);opacity:.7}}
.btn{height:48px;border:0;border-radius:8px;font-family:'Chakra Petch',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer}
.btn2{background:#2f3136;color:#ffffff;box-shadow:inset 0 0 0 1px #5b5e65,inset 0 -3px 0 #232428}
.danger{background:#b8392a;color:#ffffff;box-shadow:inset 0 -3px 0 #7d2219}
.danger.off{opacity:.4;cursor:default}
.pick{position:relative;width:72px;height:72px;border:0;padding:0;border-radius:6px;background:#2f3136;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 0 0 1px #55585f}
.pick.on{background:#4a2b27;box-shadow:inset 0 0 0 2px #ff6b57}
.pick .px{width:48px;height:48px}
.crk{position:absolute;inset:0;pointer-events:none}
.shake{animation:shake .45s linear}
@keyframes shake{20%{transform:translate(-2px,0)}40%{transform:translate(2px,-1px)}60%{transform:translate(-2px,1px)}80%{transform:translate(2px,0)}}
.cracks{animation:crackIn .2s steps(2) forwards}
@keyframes crackIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.shardbox{position:relative;width:40px;height:40px}
.shard{position:absolute;width:20px;height:20px;background-size:40px 40px;image-rendering:pixelated;animation-duration:.8s;animation-timing-function:cubic-bezier(.45,-.35,.9,.6);animation-fill-mode:forwards}
.sh1{left:0;top:0;background-position:0 0;animation-name:f1}
.sh2{left:20px;top:0;background-position:-20px 0;animation-name:f2;animation-delay:.04s}
.sh3{left:0;top:20px;background-position:0 -20px;animation-name:f3;animation-delay:.08s}
.sh4{left:20px;top:20px;background-position:-20px -20px;animation-name:f4;animation-delay:.02s}
@keyframes f1{30%{transform:translate(-14px,-22px) rotate(-40deg)}100%{transform:translate(-40px,320px) rotate(-260deg);opacity:.9}}
@keyframes f2{30%{transform:translate(14px,-26px) rotate(50deg)}100%{transform:translate(46px,330px) rotate(300deg);opacity:.9}}
@keyframes f3{30%{transform:translate(-10px,-10px) rotate(-30deg)}100%{transform:translate(-22px,300px) rotate(-200deg);opacity:.9}}
@keyframes f4{30%{transform:translate(12px,-12px) rotate(35deg)}100%{transform:translate(28px,310px) rotate(220deg);opacity:.9}}
.dust{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:#c9ccd2;animation:dust .5s ease-out forwards}
.d1{--dx:-26px;--dy:-18px}.d2{--dx:24px;--dy:-22px}.d3{--dx:-20px;--dy:16px}.d4{--dx:22px;--dy:14px}
@keyframes dust{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.land{animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{from{transform:translateY(-70px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.sheet{animation:sheetUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.bobble{animation:bobble 1.4s ease-in-out infinite}
@keyframes bobble{50%{transform:translateY(-3px)}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 50px 16px 34px; display: flex; flex-direction: column; justify-content: space-between; background: #46494f; color: #ffffff; font-family: 'Chakra Petch', sans-serif">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 44px; height: 44px; border-radius: 10px; background: #2f3136; box-shadow: inset 0 0 0 1px #55585f; display: flex; align-items: center; justify-content: center; font-family: 'Jersey 10', sans-serif; font-size: 26px">5-2</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 2px">BASALT DARK</div>
<div style="display: flex; gap: 6px; align-items: center">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #2b1505; background: #ffa766; padding: 0 6px; border-radius: 3px">HARD</span>
<span style="font-size: 12px; color: #d6d8dd">Today 38,982</span>
</div>
</div>
<button class="ibtn" aria-label="Map"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg></button>
<button class="ibtn" aria-label="Sound on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M17 9a4 4 0 0 1 0 6"></path></svg></button>
</div>
<div style="position: relative; height: 36px; border-radius: 6px; background: #2f3136; box-shadow: inset 0 0 0 1px #55585f; overflow: hidden">
<div style="width: 25%; height: 100%; background: #d9982b; box-shadow: inset 0 3px 0 rgba(255,255,255,.18), inset 0 -3px 0 rgba(0,0,0,.18)"></div>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Jersey 10', sans-serif; text-shadow: 0 2px 0 rgba(0,0,0,.5)">
<span style="font-size: 30px; line-height: 1">640</span>
<span style="font-size: 20px; line-height: 1; color: #d6d8dd">/ 2,520</span>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 10px; border-radius: 10px; background: #3d4045; box-shadow: inset 0 0 0 1px #55585f">
<sc-for list="{{bar}}" as="o" hint-placeholder-count="7">
<div aria-label="{{o.label}}" style="display: flex; align-items: center; gap: 3px">
<div class="{{o.cls}}"><div class="{{o.sprCls}}"></div></div>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 18px">{{o.n}}</span>
</div>
</sc-for>
</div>
<div style="align-self: center; padding: 4px; border-radius: 6px; background: #232428; box-shadow: 0 0 0 1px #55585f">
<div style="display: grid; grid-template-columns: repeat(8, 42px); grid-auto-rows: 42px; gap: 2px">
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="64">
<div class="{{cell.cls}}"><sc-if value="{{cell.spr}}" hint-placeholder-val="{{ false }}"><div class="{{cell.sprCls}}"></div></sc-if></div>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; background: #3d4045; box-shadow: inset 0 0 0 1px #55585f">
<sc-for list="{{dock}}" as="d" hint-placeholder-count="3">
<div class="tool" aria-label="{{d.label}}">
<sc-if value="{{d.showSprite}}" hint-placeholder-val="{{ true }}"><div class="{{d.sprCls}}"></div></sc-if>
<sc-if value="{{d.spark}}" hint-placeholder-val="{{ false }}"><span class="spark"></span></sc-if>
<sc-if value="{{d.crack}}" hint-placeholder-val="{{ false }}"><svg class="crk cracks" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M8 2 L7 5 L9 7 L6 10 L8 12 L7 14 M9 7 L12 6 L13 8 M6 10 L3 11" fill="none" stroke="#111" stroke-width="1.6"></path><path d="M8 2 L7 5 L9 7 L6 10 L8 12 L7 14 M9 7 L12 6 L13 8 M6 10 L3 11" fill="none" stroke="#fff" stroke-width=".6"></path></svg></sc-if>
<sc-if value="{{d.shatter}}" hint-placeholder-val="{{ false }}">
<div class="shardbox">
<sc-for list="{{d.shards}}" as="s" hint-placeholder-count="4"><div class="{{s.cls}}"></div></sc-for>
<span class="dust d1"></span><span class="dust d2"></span><span class="dust d3"></span><span class="dust d4"></span>
</div>
</sc-if>
</div>
</sc-for>
<div style="flex: 1"></div>
<div style="width: 1px; align-self: stretch; background: #55585f"></div>
<button aria-label="Open anvil to craft specials" style="height: 56px; padding: 0 14px 0 10px; border: 0; border-radius: 4px; background: #35383d; color: #ffcf5c; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.5px"><div class="px px-anvil"></div>CRAFT</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{pieces}}" as="p" hint-placeholder-count="3">
<div style="height: 114px; border-radius: 10px; background: #3d4045; box-shadow: inset 0 0 0 1px #55585f; display: flex; align-items: center; justify-content: center">
<div class="{{p.cls}}">
<sc-for list="{{p.cells}}" as="c" hint-placeholder-count="5">
<div class="{{c.cls}}"><sc-if value="{{c.spr}}" hint-placeholder-val="{{ false }}"><div class="{{c.sprCls}}"></div></sc-if></div>
</sc-for>
</div>
</div>
</sc-for>
</div>
<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; background: rgba(12,13,16,.62); display: flex; flex-direction: column; justify-content: flex-end; z-index: 4">
<div class="sheet" role="dialog" aria-label="No free special slot" style="display: flex; flex-direction: column; gap: 18px; padding: 12px 20px 34px; border-radius: 16px 16px 0 0; background: #3d4045; box-shadow: inset 0 1px 0 #6a6d74">
<div style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #6a6d74"></div>
<div style="display: flex; gap: 14px; align-items: center">
<div class="tool" style="width: 64px; height: 64px; box-shadow: inset 0 0 0 1px #ffcf5c80"><div class="px px-dyn" style="width: 46px; height: 46px"></div></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #ffcf5c">ALL 3 SLOTS FULL</div>
<div style="font-family: 'Jersey 10', sans-serif; font-size: 28px; line-height: 1">Make room for a Blast Charge</div>
</div>
</div>
<div style="font-size: 14px; line-height: 1.45; color: #d6d8dd">Pick a special to destroy. Your ore is only spent if you go ahead.</div>
<div style="display: flex; justify-content: center; gap: 14px">
<sc-for list="{{picks}}" as="k" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px">
<button class="{{k.cls}}" onClick="{{k.pick}}" aria-label="{{k.label}}" aria-pressed="{{k.sel}}">
<div class="px {{k.px}}"></div>
<sc-if value="{{k.sel}}" hint-placeholder-val="{{ false }}"><svg class="crk" viewBox="0 0 16 16"><path d="M8 2 L7 5 L9 7 L6 10 L8 12 L7 14 M9 7 L12 6 L13 8 M6 10 L3 11" fill="none" stroke="#ff8a7a" stroke-width=".7"></path></svg></sc-if>
</button>
<sc-if value="{{k.sel}}" hint-placeholder-val="{{ false }}"><div style="font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #ff8a7a">DESTROY</div></sc-if>
<sc-if value="{{k.unsel}}" hint-placeholder-val="{{ true }}"><div style="font-size: 11px; color: #d6d8dd; text-align: center">{{k.name}}</div></sc-if>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 10px">
<button class="btn btn2" onClick="{{cancel}}" style="flex: 1">CANCEL</button>
<button class="{{ctaCls}}" onClick="{{confirm}}" style="flex: 1.5">DESTROY &amp; CRAFT</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  later(ms, f) { this._tm = this._tm || []; this._tm.push(setTimeout(f, ms)); }
  componentWillUnmount() { (this._tm || []).forEach(clearTimeout); }
  renderVals() {
    const NEW = 'dyn';
    const NAMES = { dyn: 'Blast Charge', sledge: 'Sledgehammer' };
    const START = ['dyn', 'sledge', 'dyn'];
    const s = this.state || {};
    const phase = s.phase || 'sheet';
    const sel = s.sel === undefined ? -1 : s.sel;
    const slots = s.slots || START;
    const BASE = { t: 'turf', w: 'wood', l: 'limestone', g: 'granite', s: 'slate', b: 'basalt', m: 'magma' };
    const ORE = { C: ['coal', 'ore'], I: ['iron', 'ore'], U: ['copper', 'ore'], G: ['gold', 'ore gold'], R: ['ruby', 'gem'], E: ['emerald', 'gem'], D: ['diamond', 'gem'] };
    const cell = (tok) => {
      if (tok === '.') return { cls: 'slot', spr: false, sprCls: '' };
      if (tok === '_') return { cls: 'gap', spr: false, sprCls: '' };
      const o = ORE[tok[1]];
      return { cls: 'blk b-' + BASE[tok[0]] + (o ? ' g-' + o[0] : ''), spr: !!o, sprCls: o ? 'spr ' + o[1] + ' s-' + o[0] : '' };
    };
    const board = ['. . . . s s sE s', '. . . . . b b .', '. gU gG . . . . .', '. g lI . . . . .', '. . . . . . bG .', 't t . . . b bR b', 'w w w . . bC s s', 'mD m mU . bI b b b'];
    const cells = board.map((r) => r.split(' ').slice(0, 8)).flat().map(cell);
    const pieces = [[['s', 's', 'sU', 's', 's']], [['w', '_'], ['w', '_'], ['w', 'w']], [['m', 'mD', 'm'], ['_', 'm', '_']]].map((p) => ({ cls: 'piece pw' + p[0].length, cells: p.flat().map(cell) }));
    const bar = [['coal', 'Coal', 137, 'ore'], ['iron', 'Iron', 89, 'ore'], ['copper', 'Copper', 64, 'ore'], ['gold', 'Gold', 12, 'ore gold'], ['ruby', 'Ruby', 5, 'gem'], ['emerald', 'Emerald', 3, 'gem'], ['diamond', 'Diamond', 1, 'gem']].map((o) => ({ cls: 'ico g-' + o[0], sprCls: 'spr ' + o[3] + ' s-' + o[0], n: String(o[2]), label: o[1] + ': ' + o[2] }));
    const dock = slots.map((k, i) => {
      const t = i === sel;
      return {
        label: NAMES[k],
        showSprite: !(t && phase === 'shatter'),
        sprCls: 'px px-' + k + (t && phase === 'crack' ? ' shake' : '') + (t && phase === 'land' ? ' land' : ''),
        spark: k === 'dyn' && !(t && (phase === 'crack' || phase === 'shatter')),
        crack: t && phase === 'crack',
        shatter: t && phase === 'shatter',
        shards: [1, 2, 3, 4].map((n) => ({ cls: 'shard sh' + n + ' px-' + k }))
      };
    });
    const picks = slots.map((k, i) => ({ cls: 'pick' + (i === sel ? ' on' : ''), px: 'px-' + k, sel: i === sel, unsel: i !== sel, name: NAMES[k], label: 'Destroy ' + NAMES[k], pick: () => this.setState({ sel: i }) }));
    const confirm = () => {
      if (sel < 0) return;
      this.setState({ phase: 'crack' });
      this.later(450, () => this.setState({ phase: 'shatter' }));
      this.later(1300, () => { const ns = slots.slice(); ns[sel] = NEW; this.setState({ phase: 'land', slots: ns }); });
      this.later(1850, () => this.setState({ phase: 'done' }));
    };
    return {
      cells, pieces, bar, dock, picks, confirm,
      sheetOpen: phase === 'sheet',
      ctaCls: 'btn danger' + (sel < 0 ? ' off' : ''),
      cancel: () => this.setState({ phase: 'cancelled', sel: -1 })
    };
  }
}
</script>
</body>
</html>
